# PenguinCAM-config.yaml
# STEPCRAFT D.600 + UCCNC
# Conservative starter profile for FTC-style flat plates.
# Units in this file are inches / IPM unless PenguinCAM states otherwise.

version: 2
default_machine: stepcraft_d600

team:
  number: 0
  name: "STEPCRAFT D600"

machines:
  stepcraft_d600:
    name: "STEPCRAFT D.600"
    machine:
      name: "STEPCRAFT D.600"
      manufacturer: "STEPCRAFT"
      model: "D.600"
      controller: "UCCNC"
      # Keep PenguinCAM's inch-native UI/presets, but emit G21 metric NC for the
      # active Stepcraft2_Model600 UCCNC profile.
      gcode_units: "mm"

      # Controller-safe travel from the active UCCNC profile: 417 x 597 x 137 mm
      # Rounded down in inches so CAM bounds stay inside the configured soft limits.
      dimensions:
        x_max: 16.41
        y_max: 23.50
        z_max: 5.39

      park_position:
        x: 0.5
        y: 0.5
        z: -0.5

      standard_work_offset: "G54"
      tube_jig_work_offset: "G55"
      coolant: "None"

    # Tool inventory is retained in the team configuration for setup checks and
    # operator handoff. PenguinCAM currently consumes only default_tool.diameter;
    # named-tool selection is not yet implemented in the GUI.
    tool_inventory:
      amana_51404:
        name: "Amana Tool 51404"
        description: "Plastic-cutting solid-carbide single O-flute upcut cutter"
        manufacturer: "Amana Tool"
        part_number: "51404"
        diameter: 0.250
        shank_diameter: 0.250
        cutting_length: 0.750
        overall_length: 2.000
        flutes: 1
        flute_geometry: "O-flute"
        cut_direction: "upcut"

      amana_51411:
        name: "Amana Tool 51411"
        description: "Plastic-cutting solid-carbide single O-flute upcut cutter with 1/4 in shank"
        manufacturer: "Amana Tool"
        part_number: "51411"
        diameter: 0.125
        shank_diameter: 0.250
        cutting_length: 0.500
        overall_length: 2.000
        flutes: 1
        flute_geometry: "O-flute"
        cut_direction: "upcut"

      amana_51454:
        name: "Amana Tool 51454"
        description: "Single O-flute upcut cutter with the more rigid 1/4 in shank"
        manufacturer: "Amana Tool"
        part_number: "51454"
        diameter: 0.125
        shank_diameter: 0.250
        cutting_length: 0.500
        flutes: 1
        flute_geometry: "O-flute"
        cut_direction: "upcut"

      amana_51459:
        name: "Amana Tool 51459"
        description: "Single O-flute upcut cutter; requires a dedicated 1/8 in ER11 collet"
        manufacturer: "Amana Tool"
        part_number: "51459"
        diameter: 0.125
        shank_diameter: 0.125
        cutting_length: 0.500
        overall_length: 2.000
        flutes: 1
        flute_geometry: "O-flute"
        cut_direction: "upcut"

    default_tool:
      inventory_id: "amana_51411"
      diameter: 0.125   # Amana 51411: 1/8 in cutting diameter and 1/4 in shank

    machining:
      z_reference:
        sacrifice_board_depth: 0.005
        clearance_height: 0.250

      tabs:
        enabled: true
        width: 0.20
        height: 0.05
        remove_tabs: false

      holes:
        detection_tolerance: 0.001
        min_millable_multiplier: 1.20

      fixturing:
        pause_before_perimeter: true

    tube_facing:
      depth_margin: 0.003
      max_roughing_depth: 0.040
      max_finishing_depth: 0.060
      phase_1:
        roughing_tool_edge: 0.020
        finishing_tool_edge: 0.030
      phase_2:
        roughing_tool_edge: -0.005
        finishing_tool_edge: 0.000
      arc_advance: 0.020
      arc_radius: 0.030

    materials:
      acetal:
        name: "Acetal - Delrin - POM"
        description: "Conservative 3 mm sheet profile for Amana 51411, 1/8 in single O-flute upcut"
        spindle_speed: 18000
        feed_rate: 75.0
        ramp_feed_rate: 35.0
        plunge_rate: 10.0
        traverse_rate: 90.0
        approach_rate: 15.0
        ramp_angle: 6.0
        ramp_start_clearance: 0.060
        stepover_percentage: 0.35
        helix_radius_multiplier: 0.60
        max_slotting_depth: 0.060
        peck_drill_depth: 0.060
        tab_width: 0.20
        tab_height: 0.04

      polycarbonate:
        name: "Polycarbonate"
        description: "Conservative STEPCRAFT D.600 profile for 1/8 in FTC plates"
        spindle_speed: 14000
        feed_rate: 24.0
        ramp_feed_rate: 16.0
        plunge_rate: 6.0
        traverse_rate: 90.0
        approach_rate: 15.0
        ramp_angle: 8.0
        ramp_start_clearance: 0.060
        stepover_percentage: 0.35
        helix_radius_multiplier: 0.60
        max_slotting_depth: 0.040
        peck_drill_depth: 0.040
        tab_width: 0.20
        tab_height: 0.05

      plywood:
        name: "Plywood"
        description: "Conservative STEPCRAFT D.600 plywood profile"
        spindle_speed: 16000
        feed_rate: 35.0
        ramp_feed_rate: 22.0
        plunge_rate: 10.0
        traverse_rate: 90.0
        approach_rate: 18.0
        ramp_angle: 10.0
        ramp_start_clearance: 0.100
        stepover_percentage: 0.45
        helix_radius_multiplier: 0.60
        max_slotting_depth: 0.080
        peck_drill_depth: 0.050
        tab_width: 0.20
        tab_height: 0.06

      aluminum:
        name: "Aluminum"
        description: "Very conservative STEPCRAFT D.600 aluminum profile"
        spindle_speed: 12000
        feed_rate: 12.0
        ramp_feed_rate: 8.0
        plunge_rate: 4.0
        traverse_rate: 70.0
        approach_rate: 10.0
        ramp_angle: 3.0
        ramp_start_clearance: 0.040
        stepover_percentage: 0.20
        helix_radius_multiplier: 0.45
        max_slotting_depth: 0.025
        peck_drill_depth: 0.030
        tab_width: 0.20
        tab_height: 0.05

    integrations:
      google_drive:
        enabled: false
